services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8080}:8080"
    volumes:
      - evolution_instances:/evolution/instances
    env_file:
      - .env.evolution
    networks:
      - evolution-net

volumes:
  evolution_instances:

networks:
  evolution-net:
    driver: bridge
