server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico)$ {
    expires -1;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
}
