services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: botmensagem
      POSTGRES_USER: botmensagem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botmensagem}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botmensagem -d botmensagem"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://botmensagem:${POSTGRES_PASSWORD:-botmensagem}@postgres:5432/botmensagem?sslmode=disable
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      PUBLIC_API_URL: /api
      AUTH_SECRET: ${AUTH_SECRET:?Configure AUTH_SECRET in .env before starting the OCI stack}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      GENERATED_DIR: /app/storage/generated
      UPLOADS_DIR: /app/storage/uploads
      ASSETS_DIR: /app/assets
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - api_generated:/app/storage/generated
      - api_uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  api_uploads:
  api_generated:
